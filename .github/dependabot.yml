version: 2
updates:
  # Python dependencies (requirements.txt and requirements-dev.txt).
  # One weekly PR for all pip updates (majors included) instead of one per
  # package, so a batch goes through a single deploy.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
