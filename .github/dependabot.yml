version: 2
updates:
  # Python dependencies (requirements.txt and requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to 1.8.8 while testing whether 1.8.9 causes the outbound
      # timeouts seen on 2026-11-03. Remove once that's settled.
      - dependency-name: "azure-monitor-opentelemetry"
        versions: ["1.8.9"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
